name: Release

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  # One Node version here, not the whole matrix. Cross-version coverage belongs
  # to CI, which ran every supported version on the pull request that produced
  # this commit; repeating it on the merge tested nothing new and multiplied the
  # runners for every release. The release commit is still tested, on the active
  # LTS.
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Loads the built artifacts the way consumers do; the unit tests import
      # TypeScript sources and cannot catch a wrong module format.
      - name: Smoke test built package
        run: npm run smoke

  # The smoke test above loads the built artifacts, but from inside the
  # repository, where local resolution hides anything the tarball gets wrong.
  # This installs the packed tarball in a clean directory instead, which is the
  # only path a consumer actually takes.
  pack:
    name: Verify the package installs as a consumer
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run verify:pack

  release:
    name: Release
    needs: [test, pack]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      # Credentials are deliberately persisted here: this job commits the
      # version bump back to the release branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Consumes any pending changesets into the version, changelog and
      # lockfile. Merging into a release branch publishes; the bump itself is
      # landed by the step below.
      - name: Apply pending changesets
        run: npm run release:version

      # The bump reaches the branch through a pull request rather than a direct
      # push, because the branch requires one and GitHub does not let a personal
      # repository grant Actions a ruleset bypass. The guard on main lets
      # bot-authored pull requests through for exactly this reason.
      #
      # The local checkout is moved onto the merge commit afterwards, so the tag
      # changesets creates during publish points at a commit that is actually on
      # the release branch.
      - name: Land the version bump through a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/version-packages-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to version, leaving $GITHUB_REF_NAME untouched"
            exit 0
          fi
          git commit -m 'chore: version packages'
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title 'chore: version packages' \
            --body 'Lands the version, changelog and lockfile that changesets computed for this release. Opened and merged by the Release workflow, which is held to the same pull request rule as everyone else.'
          gh pr merge "$BRANCH" --merge --delete-branch
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      # Publishes whatever is now unpublished and creates the git tag and GitHub
      # release. Publishing goes through the runner's own npm, so it uses OIDC
      # trusted publishing and needs no long-lived token; provenance comes from
      # publishConfig.
      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release

  jsr:
    name: Publish to JSR
    needs: release
    runs-on: ubuntu-latest
    # Deliberately not gated on "did npm publish this run". Both publishes are
    # idempotent, so running every time lets a registry that fell behind catch
    # up on its own instead of needing someone to push it by hand.
    permissions:
      contents: read
      id-token: write
    steps:
      # The release job commits the version bump during this run, so the
      # triggering commit still carries the previous version. Check out the
      # branch tip instead, or JSR republishes the version already released.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # package.json is the version source of truth under changesets, so the
      # version is read locally rather than polled back from the registry.
      - name: Sync jsr.json version
        run: |
          node -e "
            const fs = require('fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = version;
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "

      - name: Publish to JSR
        run: npm run publish:jsr

      # `jsr publish` exits 0 when it skips an already-published version, so a
      # green step never proved anything shipped. Both registries are asserted
      # to actually serve this version before the run is called a success.
      - name: Verify both registries serve this version
        run: npm run verify:published

  # A release cut from main is tagged on main's own commit, and nothing brings
  # that commit back. development then still believes the old version is current
  # and computes its next beta from it, re-deriving a version that has already
  # shipped. GitFlow's answer is the back-merge, so it happens here rather than
  # by remembering — development requires a pull request, so this opens one and
  # merges it instead of leaving one waiting.
  backmerge:
    name: Keep development in step with main
    needs: release
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge main into development when it is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/backmerge-main
        run: |
          set -euo pipefail
          git fetch origin main development
          if git merge-base --is-ancestor origin/main origin/development; then
            echo "development already contains main; nothing to back-merge"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH" origin/development
          if ! git merge --no-ff origin/main -m 'chore: back-merge main into development'; then
            echo "::error::main does not merge cleanly into development. Resolve it by hand; until then every release cut on main stays invisible to the beta channel."
            exit 1
          fi
          # Plain --force: nothing fetched this branch, so a lease would have no
          # remote-tracking ref to compare against and would reject the push the
          # moment the branch survived an earlier release. Only this job writes it.
          git push --force origin "$BRANCH"
          gh pr create --base development --head "$BRANCH" \
            --title 'chore: back-merge main into development' \
            --body 'Carries the release commits from main back to development, so the beta channel computes its next version from what has actually shipped. Opened and merged by the Release workflow.'
          gh pr merge "$BRANCH" --merge --delete-branch
